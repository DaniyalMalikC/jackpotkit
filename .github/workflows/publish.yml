name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/org/jackpotkit

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run stable-release readiness checks
        run: pnpm release:check

      - name: Publish packages and create releases
        id: changesets
        uses: changesets/action@v1
        with:
          createGithubReleases: true
          publish: pnpm release

      # Starts the published-package smoke tests in jackpotkit-web and jackpotkit-app. A dispatch
      # failure must never fail an already-completed publish, so the step is skipped without a token
      # and does not fail the job. See docs/maintainers/automation.md.
      - name: Trigger companion smoke tests
        if: steps.changesets.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.COMPANION_DISPATCH_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice title=Smoke tests not triggered::COMPANION_DISPATCH_TOKEN is not set."
            exit 0
          fi
          version="$(jq -r '[.[] | select(.name == "@jackpotkit/react" or .name == "@jackpotkit/react-native") | .version] | first // "latest"' <<<"$PUBLISHED")"
          for repo in DaniyalMalikC/jackpotkit-web DaniyalMalikC/jackpotkit-app; do
            gh api --method POST "repos/${repo}/dispatches" \
              -f event_type=jackpotkit-release \
              -F "client_payload[version]=${version}"
          done
