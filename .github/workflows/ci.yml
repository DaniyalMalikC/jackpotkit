name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, validate, build, and inspect packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete validation
        run: pnpm validate

  e2e:
    name: Browser end-to-end tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The docs build embeds the native preview from this origin; the native-<browser> project's
      # static server (apps/e2e/scripts/static-server.mjs) serves the Expo web export there.
      NEXT_PUBLIC_NATIVE_PREVIEW_URL: http://127.0.0.1:4174
    strategy:
      fail-fast: false
      matrix:
        # Firefox and WebKit are supported by apps/e2e/playwright.config.ts; add them here to widen
        # coverage (see docs/maintainers/automation.md).
        browser: [chromium]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser and system dependencies
        run: pnpm --filter @jackpotkit/e2e exec playwright install --with-deps "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}

      - name: Build the gallery, the docs site, and their packages
        run: pnpm turbo run build --filter=@jackpotkit/web-example... --filter=@jackpotkit/docs...

      - name: Export the Expo gallery for the web (native preview)
        run: pnpm turbo run build:web --filter=@jackpotkit/expo-example

      # Runs three projects per browser: gallery-<browser> (vite preview), docs-<browser>
      # (next start), and native-<browser> (static server for the Expo web export), each started by
      # apps/e2e/playwright.config.ts.
      - name: Run browser end-to-end tests
        run: pnpm test:e2e
        env:
          E2E_BROWSERS: ${{ matrix.browser }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
